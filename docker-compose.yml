# Local three tier stack: http://localhost:3000
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pennypilot
      POSTGRES_PASSWORD: pennypilot
      POSTGRES_DB: pennypilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pennypilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: local
        GIT_SHA: compose
    environment:
      DB_HOST: db
      DB_USER: pennypilot
      DB_PASSWORD: pennypilot
      DB_NAME: pennypilot
      APP_ENV: local
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        APP_VERSION: local
    environment:
      API_UPSTREAM: backend:8080
    depends_on:
      - backend
    ports:
      - "3000:8080"

volumes:
  pgdata:
