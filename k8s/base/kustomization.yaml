apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pennypilot

labels:
  - pairs:
      app.kubernetes.io/managed-by: jenkins
    includeSelectors: false

resources:
  - namespace.yaml
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml

# The pipeline runs `kustomize edit set image` to pin these to the build tag.
images:
  - name: pennypilot-api
    newName: europe-west1-docker.pkg.dev/your-gcp-project-id/pennypilot/api
    newTag: latest
  - name: pennypilot-web
    newName: europe-west1-docker.pkg.dev/your-gcp-project-id/pennypilot/web
    newTag: latest
