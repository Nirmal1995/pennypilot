# Local Jenkins for the PennyPilot pipeline: http://localhost:8081
#   cd jenkins && docker compose up -d --build
#   docker compose exec jenkins cat /var/jenkins_home/secrets/initialAdminPassword
#
# The host Docker socket is mounted so pipeline stages can run containers.
# Running as root keeps socket permissions simple on Docker Desktop. Lab use only.
services:
  jenkins:
    build: .
    image: pennypilot-jenkins:local
    container_name: jenkins
    user: root
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
